<html lang="fr">
<head>
<meta charset="utf-8">

<title>Dates — DLC du foyer</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net; img-src 'self' data:; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">

<style>
:root{
  --creme:   oklch(96.5% 0.032 92);
  --creme-2: oklch(93.5% 0.048 90);
  --blanc:   oklch(99.4% 0.008 92);
  --encre:   oklch(30% 0.042 62);
  --doux:    oklch(56% 0.032 70);
  --pale:    oklch(70% 0.028 75);
  --miel:    oklch(86% 0.155 88);
  --ambre:   oklch(63% 0.145 62);
  --vert:    oklch(70% 0.145 152);
  --vert-f:  oklch(48% 0.12 152);
  --rouge:   oklch(60% 0.185 28);
  --gel:     oklch(72% 0.115 236);
  --ligne:   oklch(30% 0.042 62 / .10);
  --ligne-2: oklch(30% 0.042 62 / .18);
  --ombre:   0 1px 2px oklch(30% 0.042 62 / .05), 0 8px 22px oklch(30% 0.042 62 / .07);
  --ombre-h: 0 2px 4px oklch(30% 0.042 62 / .06), 0 14px 30px oklch(30% 0.042 62 / .10);

  --mono: ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --sans: system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --micro: 10.5px;
  --titre: clamp(26px, 7.5vw, 34px);
  --geant: clamp(34px, 10vw, 44px);
  --r-carte: 20px;
  --sortie: cubic-bezier(.16,1,.3,1);
  --court: 150ms; --moyen: 280ms; --long: 640ms;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--encre);font-family:var(--sans);font-size:16px;line-height:1.45;
  padding-bottom:224px;min-height:100vh;
  background:
    radial-gradient(120% 60% at 50% -10%, var(--creme-2) 0%, transparent 62%),
    var(--creme);
}
.wrap{max-width:640px;margin:0 auto;padding:24px 16px 0}
.cache{display:none!important}
svg.i{width:1em;height:1em;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em}

/* ── en-tête ── */
header{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.oeil{font-family:var(--mono);font-size:var(--micro);letter-spacing:.18em;text-transform:uppercase;color:var(--pale)}
h1{font-size:var(--titre);font-weight:700;margin:7px 0 0;letter-spacing:-.035em;line-height:1.02}
h1 em{font-style:normal;color:var(--ambre)}
.jour{background:var(--blanc);border-radius:16px;padding:10px 13px;text-align:center;
  box-shadow:var(--ombre);flex-shrink:0}
.jour b{display:block;font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:-.02em}
.jour span{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--pale);font-family:var(--mono)}

.fil{display:flex;align-items:center;gap:8px;margin-top:18px;font-family:var(--mono);
  font-size:var(--micro);letter-spacing:.1em;text-transform:uppercase;color:var(--pale)}
.led{width:7px;height:7px;border-radius:50%;background:var(--pale);flex-shrink:0}
.fil.vivant .led{background:var(--vert);box-shadow:0 0 0 3px oklch(70% 0.145 152 / .2)}
.fil.coupe .led{background:var(--rouge)}
.fil.attente .led{background:var(--miel);animation:battement 1.6s infinite}
@keyframes battement{50%{opacity:.3}}
.fil button{margin-left:auto;background:none;border:none;color:var(--pale);font:inherit;
  letter-spacing:inherit;text-transform:inherit;cursor:pointer;padding:4px 0;text-decoration:underline}

/* ── verdict ── */
.verdict{margin:16px 0 0;background:var(--miel);border-radius:var(--r-carte);
  padding:20px 22px;display:flex;align-items:center;gap:16px;box-shadow:var(--ombre)}
.verdict.calme{background:var(--blanc)}
.verdict .nb{font-size:var(--geant);font-weight:800;line-height:.9;letter-spacing:-.05em;
  color:oklch(38% 0.13 70)}
.verdict.calme .nb{color:var(--vert-f)}
.verdict .txt{font-size:13.5px;color:oklch(45% 0.09 70);line-height:1.3}
.verdict.calme .txt{color:var(--doux)}
.verdict .txt b{display:block;font-weight:700;font-size:16px;letter-spacing:-.015em;
  color:oklch(30% 0.11 70);margin-bottom:2px}
.verdict.calme .txt b{color:var(--encre)}

/* ── filtres ── */
.filtres{display:flex;gap:7px;margin-top:20px;overflow-x:auto;scrollbar-width:none}
.filtres::-webkit-scrollbar{display:none}
.puce{flex:1;min-width:74px;font-size:12px;font-weight:600;background:var(--blanc);
  border:1px solid transparent;color:var(--doux);padding:11px 8px;border-radius:999px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;
  box-shadow:0 1px 2px oklch(30% 0.042 62 / .05);
  transition:background var(--court),color var(--court),transform var(--court)}
.puce svg.i{font-size:14px;color:var(--pale)}
.puce:active{transform:scale(.96)}
.puce.actif{background:var(--encre);color:var(--blanc)}
.puce.actif svg.i{color:var(--miel)}

/* ── groupes ── */
.groupe{margin-top:28px}
.groupe h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--pale);
  font-weight:700;margin:0 0 10px;padding-left:4px;display:flex;align-items:center;gap:8px}
.groupe h2 b{background:var(--creme-2);color:var(--doux);border-radius:999px;
  padding:2px 8px;font-size:11px}

/* ── carte produit ── */
.carte{background:var(--blanc);border-radius:var(--r-carte);margin-bottom:10px;
  box-shadow:var(--ombre);overflow:hidden;transition:box-shadow var(--moyen) var(--sortie)}
.carte.ouvert{box-shadow:var(--ombre-h)}
.tete{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:14px;
  padding:14px 18px 14px 14px;cursor:pointer}
.compte{width:56px;height:56px;border-radius:18px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-weight:800;font-size:21px;letter-spacing:-.04em;
  line-height:1;background:var(--creme-2);color:var(--doux)}
.compte span{font-size:8px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  margin-top:3px;opacity:.75}
.perime  .compte{background:oklch(60% 0.185 28 / .13);color:var(--rouge)}
.urgent  .compte{background:var(--miel);color:oklch(38% 0.13 70)}
.semaine .compte{background:oklch(70% 0.145 152 / .16);color:var(--vert-f)}
.nom{font-weight:600;font-size:16px;letter-spacing:-.01em;overflow-wrap:anywhere;min-width:0}
.meta{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:11.5px;
  font-weight:500;color:var(--pale)}
.meta .ouvert{color:var(--ambre)}
.meta .gele{color:var(--gel)}
.qte{font-size:11.5px;font-weight:700;color:var(--blanc);background:var(--encre);
  border-radius:999px;padding:2px 8px;margin-left:8px;vertical-align:1.5px}
.date-imp{font-family:var(--mono);font-size:12px;color:var(--pale);letter-spacing:.02em}

/* ── panneau d'édition ── */
.actions{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--moyen) var(--sortie)}
.carte.ouvert .actions{grid-template-rows:1fr}
.dedans{overflow:hidden;min-height:0}
.pile{display:flex;flex-direction:column;gap:8px;padding:4px 14px 16px}
.rang{display:flex;gap:7px}
.rang input[type=text]{flex:1;min-width:0}
.rang input[type=number]{width:66px;text-align:center}
.rang input[type=date]{flex:1}
.rang .btn{flex:1}
.etiq{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--pale);margin:8px 0 0;padding-left:2px}

.btn{font-size:12px;font-weight:600;background:var(--creme);border:1px solid transparent;
  color:var(--doux);padding:12px 10px;border-radius:13px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:background var(--court),color var(--court),transform var(--court)}
.btn svg.i{font-size:14px}
.btn:active{transform:scale(.97)}
.btn.danger{color:var(--rouge)}
.btn.jaune{color:var(--ambre)}
.btn.gel{color:var(--gel)}
.btn.choisi{background:var(--encre);color:var(--blanc)}
.btn.choisi svg.i{color:var(--miel)}
.lieux .btn{flex:1;padding:12px 4px;font-size:11.5px}

input[type=date],input[type=text],input[type=email],input[type=password],input[type=number]{
  background:var(--creme);border:1px solid transparent;color:var(--encre);
  padding:13px 12px;border-radius:13px;font-family:var(--sans);font-size:15px;
  transition:border-color var(--court),background var(--court)}
input[type=date],input[type=number]{font-family:var(--mono);font-size:13.5px}
input:focus{border-color:var(--ligne-2);background:var(--blanc)}

.outils{display:flex;gap:8px;margin:30px 0 12px}
.outils .btn{flex:1;background:transparent;border:1px dashed var(--ligne-2)}

.vide{margin-top:56px;text-align:center;color:var(--pale);font-size:15px;line-height:1.7}
.vide svg.i{font-size:34px;color:var(--creme-2);display:block;margin:0 auto 16px;stroke-width:1.4}
.vide code{font-family:var(--mono);color:var(--doux);font-size:12.5px;display:block;margin-top:14px}

/* ── barre de saisie ── */
.barre{position:fixed;left:0;right:0;bottom:0;z-index:6;
  background:linear-gradient(180deg, oklch(96.5% 0.032 92 / 0) 0%, var(--creme) 26%);
  padding:36px 16px calc(16px + env(safe-area-inset-bottom))}
.barre-in{max-width:640px;margin:0 auto}
textarea{width:100%;background:var(--blanc);border:1px solid transparent;color:var(--encre);
  border-radius:18px;padding:15px 16px;font-family:var(--sans);font-size:16px;line-height:1.5;
  resize:none;min-height:82px;box-shadow:var(--ombre);transition:border-color var(--court)}
textarea::placeholder{color:var(--pale)}
textarea:focus{border-color:var(--miel)}
.valider{width:100%;margin-top:10px;border:none;border-radius:16px;padding:18px;cursor:pointer;
  background:var(--encre);color:var(--blanc);font-family:var(--sans);font-weight:700;font-size:16px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:var(--ombre);transition:transform var(--court)}
.valider svg.i{color:var(--miel)}
.valider:active{transform:scale(.99)}
.note{font-size:11.5px;color:var(--pale);text-align:center;margin-top:11px;line-height:1.55}

/* ── annulation ── */
.toast{position:fixed;left:16px;right:16px;bottom:232px;z-index:8;display:none;
  max-width:608px;margin:0 auto;background:var(--encre);border-radius:16px;padding:14px 16px;
  align-items:center;gap:12px;box-shadow:var(--ombre-h)}
.toast.on{display:flex;animation:monte var(--moyen) var(--sortie)}
@keyframes monte{from{opacity:0;transform:translateY(12px)}}
.toast span{flex:1;font-size:14px;color:var(--blanc);overflow-wrap:anywhere}
.toast button{background:none;border:none;color:var(--miel);font-size:12px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;cursor:pointer;padding:8px}

/* ── relecture ── */
.voile{position:fixed;inset:0;background:oklch(30% 0.042 62 / .42);z-index:10;display:none;
  align-items:center;justify-content:center;padding:14px;overflow-y:auto}
.voile.on{display:flex;animation:apparait var(--court) ease-out}
@keyframes apparait{from{opacity:0}}
.panneau{background:var(--creme);border-radius:24px;width:100%;max-width:640px;
  max-height:88vh;overflow-y:auto;padding:24px 18px;box-shadow:var(--ombre-h)}
.panneau h3{margin:0 0 6px;font-size:21px;font-weight:700;letter-spacing:-.025em}
.panneau p{margin:0 0 18px;color:var(--doux);font-size:13.5px;line-height:1.5}
.relu{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.relu input[type=text]{flex:1;min-width:0}
.relu input[type=number]{width:50px;text-align:center;padding:13px 4px}
.relu .btn{padding:13px 12px;background:var(--blanc)}
.lien{background:none;border:none;color:var(--pale);font-size:12px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;width:100%;padding:16px;cursor:pointer}

/* ── connexion ── */
.porte{position:fixed;inset:0;background:var(--creme);z-index:20;display:flex;
  align-items:center;justify-content:center;padding:26px}
.porte-in{width:100%;max-width:360px}
.porte h2{font-size:30px;margin:10px 0 8px;font-weight:700;letter-spacing:-.035em}
.porte p{color:var(--doux);font-size:14px;margin:0 0 26px;line-height:1.6}
.porte input{width:100%;margin-bottom:9px;font-size:16px;background:var(--blanc)}
.erreur{color:var(--rouge);font-size:13px;min-height:20px;margin-top:12px;text-align:center}

:focus-visible{outline:2px solid var(--ambre);outline-offset:2px}

@media (prefers-reduced-motion:no-preference){
  .arrive{opacity:0;transform:translateY(10px);animation:pose var(--long) var(--sortie) forwards}
  @keyframes pose{to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script type="module">
/* ══════════════════════════════════════════════════════════
   CONFIGURATION — à remplir après création du projet Supabase.
   Ces deux valeurs sont publiques par conception : ce qui protège
   les données, c'est la politique RLS côté serveur.

   ══════════════════════════════════════════════════════════ */
const CONFIG = {
  url:     'https://ecrbavcjxbvmlfhypjvx.supabase.co',
  anonKey: 'sb_publishable_bYugZJWBfMQxOkZGz54f5w_-Unwjrtb'
};

const distant = !!(CONFIG.url && CONFIG.anonKey);
let sb = null;
if(distant){
  const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
  sb = createClient(CONFIG.url, CONFIG.anonKey, { auth:{ persistSession:true, autoRefreshToken:true } });
}

const CACHE  = 'dlc-cache-v7';
const ATTENTE = 'dlc-attente-v7';
const FILTRE = 'dlc-filtre-v7';
const JOURS_APRES_OUVERTURE = 3;
const MOIS_AU_CONGELATEUR = 6;

let items = [], enAttente = [], attente = [], foyer = null, canal = null;
let filtre = 'tous', annulation = null, minuteur = null;
const $ = id => document.getElementById(id);

/* ══════ dates ══════ */
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MOIS_RE = 'janv(?:ier)?|f[ée]vr?(?:ier)?|mars|avr(?:il)?|mai|juin|juil(?:let)?|ao[uû]t|sept(?:embre)?|oct(?:obre)?|nov(?:embre)?|d[ée]c(?:embre)?';
function indexMois(s){
  s = s.toLowerCase();
  const t = [['janv','jan'],['fev','fév','f'],['mars'],['avr'],['mai'],['juin'],['juil'],['aou','aoû'],['sept'],['oct'],['nov'],['dec','déc']];
  for(let i=0;i<12;i++) if(t[i].some(p => s.startsWith(p))) return i;
  return -1;
}
const jour0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const restant = s => Math.round((new Date(s+'T00:00:00') - jour0()) / 86400000);
const prochaine = d => { if(d < jour0()) d.setFullYear(d.getFullYear()+1); return d; };

/* ══════ lecture de la dictée ══════ */
const VIDES = /^(le|la|les|l['’]|du|de|des|un|une|d['’]|au|aux|et|puis|alors|ensuite|pour|c['’]est|ca|ça|expire|expires?|p[ée]rim[ée]s?|jusqu['’]au|jusqu['’]a|jusqu['’]à|date|dlc)$/i;
const NOMBRES = { un:1, une:1, deux:2, trois:3, quatre:4, cinq:5, six:6, sept:7, huit:8, neuf:9, dix:10, onze:11, douze:12 };
const LIEUX = {
  'congélateur':['surgel','congel','glace','glaçon','pané','frites'],
  'frigo':['yaourt','lait','crème','creme','fromage','jambon','beurre','poulet','viande','steak','saucisse','poisson','saumon','œuf','oeuf','salade','charcuterie','escalope','skyr','fraîche','fraiche','dessert'],
  'placard':['pâtes','pates','riz','conserve','farine','sucre','biscuit','céréales','cereales','huile','café','cafe','chips','gâteau','gateau']
};
const devineLieu = nom => {
  const n = nom.toLowerCase();
  for(const [l, mots] of Object.entries(LIEUX)) if(mots.some(m => n.includes(m))) return l;
  return '';
};
function extraireDate(txt){
  let m;
  m = txt.match(new RegExp('\\b(\\d{1,2})\\s*(?:er)?\\s+(' + MOIS_RE + ')\\.?(?:\\s+(\\d{2,4}))?','i'));
  if(m){ const mo = indexMois(m[2]);
    if(mo >= 0){
      let an = null;
      if(m[3]) an = m[3].length === 2 ? 2000 + +m[3] : +m[3];
      const d = new Date(an === null ? new Date().getFullYear() : an, mo, +m[1]);
      return { date: an === null ? prochaine(d) : d, brut: m[0] }; } }
  m = txt.match(/\b(\d{1,2})\s*[\/.\-]\s*(\d{1,2})(?:\s*[\/.\-]\s*(\d{2,4}))?\b/);
  if(m){ let an = new Date().getFullYear();
    if(m[3]) an = m[3].length === 2 ? 2000 + +m[3] : +m[3];
    const d = new Date(an, +m[2]-1, +m[1]);
    return { date: m[3] ? d : prochaine(d), brut: m[0] }; }
  m = txt.match(/dans\s+(\d+|un|une|deux|trois|quatre|cinq|six)\s*(jours?|semaines?|mois)/i);
  if(m){ const n = NOMBRES[m[1].toLowerCase()] || +m[1];
    const d = jour0();
    if(/jour/i.test(m[2])) d.setDate(d.getDate()+n);
    else if(/semaine/i.test(m[2])) d.setDate(d.getDate()+n*7);
    else d.setMonth(d.getMonth()+n);
    return { date: d, brut: m[0] }; }
  m = txt.match(/apr[èe]s[- ]demain|demain|aujourd['’]hui|ce soir/i);
  if(m){ const d = jour0();
    if(/apr[èe]s/i.test(m[0])) d.setDate(d.getDate()+2);
    else if(/demain/i.test(m[0])) d.setDate(d.getDate()+1);
    return { date: d, brut: m[0] }; }
  m = txt.match(/\ble\s+(\d{1,2})\b|\b(\d{1,2})\s*$/);
  if(m){ const n = +(m[1] || m[2]);
    if(n >= 1 && n <= 31){ const a = jour0();
      let d = new Date(a.getFullYear(), a.getMonth(), n);
      if(d < a) d = new Date(a.getFullYear(), a.getMonth()+1, n);
      return { date: d, brut: m[0] }; } }
  return null;
}
function extraireQuantite(txt){
  const m = txt.match(/^\s*(\d{1,2}|un|une|deux|trois|quatre|cinq|six|sept|huit|neuf|dix|onze|douze)\s+(?=\S)/i);
  if(!m) return { qte:1, reste:txt };
  const v = /^\d+$/.test(m[1]) ? +m[1] : NOMBRES[m[1].toLowerCase()];
  if(!v || v < 1 || v > 99) return { qte:1, reste:txt };
  return { qte:v, reste: txt.slice(m[0].length) };
}
function nettoyer(nom){
  const mots = nom.replace(/[.;:!?]+/g,' ').split(/\s+/).filter(Boolean);
  while(mots.length && VIDES.test(mots[0])) mots.shift();
  while(mots.length && VIDES.test(mots[mots.length-1])) mots.pop();
  const t = mots.join(' ').trim();
  return t ? t.charAt(0).toUpperCase() + t.slice(1) : '';
}
const DATE_GLOBALE = [
  '\\b\\d{1,2}\\s*(?:er)?\\s+(?:' + MOIS_RE + ')\\.?(?:\\s+\\d{2,4})?',
  '\\b\\d{1,2}\\s*[\\/.\\-]\\s*\\d{1,2}(?:\\s*[\\/.\\-]\\s*\\d{2,4})?\\b',
  'dans\\s+(?:\\d+|un|une|deux|trois|quatre|cinq|six)\\s*(?:jours?|semaines?|mois)',
  'apr[\u00e8e]s[- ]demain|demain|aujourd[\u2019\']hui|ce soir',
  '\\ble\\s+\\d{1,2}\\b'
].join('|');

const EN_LETTRES = {
  'premier':1,'un':1,'une':1,'deux':2,'trois':3,'quatre':4,'cinq':5,'six':6,'sept':7,'huit':8,
  'neuf':9,'dix':10,'onze':11,'douze':12,'treize':13,'quatorze':14,'quinze':15,'seize':16,
  'dix-sept':17,'dix sept':17,'dix-huit':18,'dix huit':18,'dix-neuf':19,'dix neuf':19,'vingt':20,
  'vingt et un':21,'vingt-et-un':21,'vingt deux':22,'vingt-deux':22,'vingt trois':23,'vingt-trois':23,
  'vingt quatre':24,'vingt-quatre':24,'vingt cinq':25,'vingt-cinq':25,'vingt six':26,'vingt-six':26,
  'vingt sept':27,'vingt-sept':27,'vingt huit':28,'vingt-huit':28,'vingt neuf':29,'vingt-neuf':29,
  'trente':30,'trente et un':31,'trente-et-un':31
};
const MOTS_NOMBRES = Object.keys(EN_LETTRES).sort((a,b) => b.length - a.length).join('|');

/* La dictée écrit souvent les nombres en toutes lettres : « vingt-trois août ». */
function normaliserNombres(t){
  const mille = new RegExp('\\bdeux\\s+mille\\s+(' + MOTS_NOMBRES + ')\\b', 'gi');
  t = t.replace(mille, (x, mot) => 2000 + EN_LETTRES[mot.toLowerCase()]);
  const apres = new RegExp('\\b(' + MOIS_RE + ')\\s+(' + MOTS_NOMBRES + ')\\b', 'gi');
  t = t.replace(apres, (x, mo, mot) => mo + ' ' + EN_LETTRES[mot.toLowerCase()]);
  const av = new RegExp('\\b(' + MOTS_NOMBRES + ')\\s+(?=(?:' + MOIS_RE + ')\\b)', 'gi');
  t = t.replace(av, (x, mot) => EN_LETTRES[mot.toLowerCase()] + ' ');
  const qt = new RegExp('(^|[,;\\n]\\s*)(' + MOTS_NOMBRES + ')\\s+(?=\\S)', 'gi');
  return t.replace(qt, (x, sep, mot) => sep + EN_LETTRES[mot.toLowerCase()] + ' ');
}

function lire(texte){
  const t = normaliserNombres(texte.replace(/\r/g,' ').replace(/\n/g,' , ').replace(/\s+/g,' '));
  const re = new RegExp(DATE_GLOBALE, 'gi');
  const out = [];
  let debut = 0, m;
  while((m = re.exec(t)) !== null){
    const d = extraireDate(m[0]);
    if(!d) continue;
    const avant = t.slice(debut, m.index).replace(/^[\s,;.•]+|[\s,;.•]+$/g, '');
    debut = m.index + m[0].length;
    const q = extraireQuantite(avant);
    const nom = nettoyer(q.reste);
    if(nom) out.push({ nom, dlc: iso(d.date), lieu: devineLieu(nom), quantite: q.qte });
  }
  return out;
}

/* ══════ cache local et file d'attente ══════ */
const lireJSON = c => { try{ return JSON.parse(localStorage.getItem(c)) || []; }catch(e){ return []; } };
const ecrireJSON = (c, v) => { try{ localStorage.setItem(c, JSON.stringify(v)); }catch(e){} };
const cacheEcrire  = () => ecrireJSON(CACHE, items);
const attenteEcrire = () => ecrireJSON(ATTENTE, attente);

function fil(etat, texte){ $('fil').className = 'fil ' + etat; $('filTexte').textContent = texte; }
function majFil(){
  if(!distant){ fil('', 'Mode local — Supabase non configuré'); return; }
  if(attente.length){ fil('attente', attente.length + ' modification' + (attente.length>1?'s':'') + ' en attente'); return; }
  navigator.onLine ? fil('vivant','Synchronisé avec le foyer') : fil('coupe','Hors ligne — liste en cache');
}

/* Une opération part maintenant si le réseau répond, sinon elle attend son tour. */
function empiler(op){
  if(!distant) return;
  attente.push(op); attenteEcrire(); majFil(); vider();
}
async function envoyer(op){
  if(op.type === 'insert') return sb.from('produits').insert(op.lignes);
  if(op.type === 'update') return sb.from('produits').update(op.champs).eq('id', op.id);
  if(op.type === 'delete') return sb.from('produits').delete().eq('id', op.id);
  if(op.type === 'deleteMany') return sb.from('produits').delete().in('id', op.ids);
}
let vidageEnCours = false;
async function vider(){
  if(!distant || vidageEnCours || !attente.length || !foyer) return;
  vidageEnCours = true;
  while(attente.length){
    const op = attente[0];
    let res;
    try{ res = await envoyer(op); }
    catch(e){ break; }                                  // réseau coupé : on garde l'opération
    if(res && res.error){
      const reseau = !navigator.onLine || /fetch|network|timeout/i.test(res.error.message || '');
      if(reseau) break;
      attente.shift(); attenteEcrire();                 // refusée par la base : inutile de réessayer
      $('note').textContent = 'Une modification a été refusée : ' + res.error.message;
      continue;
    }
    attente.shift(); attenteEcrire();
  }
  vidageEnCours = false;
  majFil();
  if(!attente.length) await recharger();
}

async function recharger(){
  if(!distant){ items = lireJSON(CACHE); rendre(); return; }
  if(attente.length){ rendre(); return; }               // ne pas écraser des changements non envoyés
  const { data, error } = await sb.from('produits').select('*').order('dlc', { ascending:true });
  if(error){ fil('coupe','Hors ligne — liste en cache'); items = lireJSON(CACHE); rendre(); return; }
  items = data; cacheEcrire(); majFil(); rendre();
}

/* Toutes les écritures s'appliquent d'abord à l'écran, puis partent vers la base. */
function ajouter(lots){
  const lignes = lots.map(o => ({
    id: crypto.randomUUID(), nom:o.nom, dlc:o.dlc, lieu:o.lieu || '',
    quantite:o.quantite || 1, entame:false, congele_le:null, ...(foyer ? { foyer_id:foyer } : {})
  }));
  items.push(...lignes); cacheEcrire(); rendre();
  empiler({ type:'insert', lignes });
  return lignes.length;
}
function modifier(id, champs){
  const i = items.find(x => x.id === id);
  if(i) Object.assign(i, champs);
  cacheEcrire(); rendre();
  empiler({ type:'update', id, champs });
}
function retirer(id){
  items = items.filter(i => i.id !== id);
  cacheEcrire(); rendre();
  empiler({ type:'delete', id });
}
function retirerPlusieurs(lignes, texte){
  if(!lignes.length){ $('note').textContent = 'Rien à retirer.'; return; }
  const copie = lignes.map(l => ({ ...l }));
  const ids = copie.map(l => l.id);
  items = items.filter(i => !ids.includes(i.id));
  cacheEcrire(); rendre();
  empiler({ type:'deleteMany', ids });
  proposerAnnulation(texte, () => {
    items.push(...copie); cacheEcrire(); rendre();
    empiler({ type:'insert', lignes:copie });
  });
}
function restaurer(ligne){
  items.push(ligne); cacheEcrire(); rendre();
  empiler({ type:'insert', lignes:[ligne] });
}

/* ══════ annulation ══════ */
function proposerAnnulation(texte, action){
  clearTimeout(minuteur);
  annulation = action;
  $('toastTexte').textContent = texte;
  $('toast').classList.add('on');
  minuteur = setTimeout(fermerToast, 10000);
}
function fermerToast(){ $('toast').classList.remove('on'); annulation = null; }
$('toastBtn').onclick = () => { if(annulation) annulation(); fermerToast(); };

function consommer(it){
  const avant = { ...it };
  const q = (it.quantite || 1) - 1;
  if(q > 0){
    modifier(it.id, { quantite:q });
    proposerAnnulation(`${it.nom} — 1 de moins`, () => modifier(avant.id, { quantite: avant.quantite || 1 }));
  }else{
    retirer(it.id);
    proposerAnnulation(`${it.nom} retiré`, () => restaurer(avant));
  }
}
function jeter(it){
  const avant = { ...it };
  retirer(it.id);
  proposerAnnulation(`${it.nom} retiré du stock`, () => restaurer(avant));
}
/* Entamé : un produit ouvert ne tient plus que quelques jours. */
function entamer(it){
  const avant = { dlc: it.dlc, entame: !!it.entame };
  const d = jour0(); d.setDate(d.getDate() + JOURS_APRES_OUVERTURE);
  const neuve = iso(d);
  modifier(it.id, { dlc: neuve < it.dlc ? neuve : it.dlc, entame:true });
  proposerAnnulation(`${it.nom} marqué entamé`, () => modifier(it.id, avant));
}

/* Congelé : la DLC imprimée ne veut plus rien dire, on repart sur six mois. */
function congeler(it){
  const avant = { dlc: it.dlc, lieu: it.lieu || '', congele_le: it.congele_le || null };
  const d = jour0(); d.setMonth(d.getMonth() + MOIS_AU_CONGELATEUR);
  modifier(it.id, { dlc: iso(d), lieu: 'congélateur', congele_le: iso(jour0()) });
  proposerAnnulation(it.nom + ' congelé aujourd\u2019hui', () => modifier(it.id, avant));
}

/* ══════ affichage ══════ */
function majEntete(){
  const d = new Date();
  $('jour').textContent = String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0');
  $('mois').textContent = MOIS[d.getMonth()];
}
const etatJ = j => j < 0 ? 'perime' : j <= 2 ? 'urgent' : j <= 7 ? 'semaine' : '';
const compteur = j => j < 0 ? '+' + (-j) : String(j);
const legende  = j => j < 0 ? 'dépassé' : j === 0 ? "aujourd'hui" : j === 1 ? 'jour' : 'jours';

$('filtres').onclick = e => {
  const b = e.target.closest('.puce'); if(!b) return;
  filtre = b.dataset.lieu;
  try{ localStorage.setItem(FILTRE, filtre); }catch(err){}
  document.querySelectorAll('.puce').forEach(p => p.classList.toggle('actif', p.dataset.lieu === filtre));
  rendre();
};

function rendre(){
  const liste = $('liste'), resume = $('verdict');
  liste.innerHTML = '';
  items.sort((a,b) => a.dlc.localeCompare(b.dlc) || a.nom.localeCompare(b.nom));
  const vus = filtre === 'tous' ? items : items.filter(i => i.lieu === filtre);

  if(!vus.length){
    resume.innerHTML = '';
    liste.innerHTML = filtre === 'tous'
      ? `<div class="vide"><svg class="i"><use href="#ic-boite"/></svg>Aucun produit en stock.<br>Déballez les courses et dictez au fur et à mesure.
         <code>« 3 fromages frais 12 septembre »</code></div>`
      : `<div class="vide"><svg class="i"><use href="#ic-boite"/></svg>Rien ici pour le moment.</div>`;
    return;
  }
  const presses = vus.filter(i => restant(i.dlc) <= 2).reduce((n,i) => n + (i.quantite || 1), 0);
  const total   = vus.reduce((n,i) => n + (i.quantite || 1), 0);
  resume.className = 'verdict arrive' + (presses ? '' : ' calme');
  resume.innerHTML = '';
  const nb = document.createElement('div'); nb.className = 'nb';
  nb.textContent = presses ? String(presses) : '0';
  const tx = document.createElement('div'); tx.className = 'txt';
  const fort = document.createElement('b');
  fort.textContent = presses ? 'à manger sous 48 heures' : 'rien d\u2019urgent';
  tx.appendChild(fort);
  tx.appendChild(document.createTextNode(total + ' article' + (total>1?'s':'') + ' en stock'));
  resume.append(nb, tx);

  [['Dépassé', j => j < 0], ['Sous 48 heures', j => j >= 0 && j <= 2],
   ['Cette semaine', j => j > 2 && j <= 7], ['Plus tard', j => j > 7]].forEach(([titre, test]) => {
    const lot = vus.filter(i => test(restant(i.dlc)));
    if(!lot.length) return;
    const bloc = document.createElement('div');
    bloc.className = 'groupe';
    bloc.innerHTML = `<h2>${titre} <b>${lot.length}</b></h2>`;
    lot.forEach(it => bloc.appendChild(carte(it)));
    liste.appendChild(bloc);
  });
}

function carte(it){
  const j = restant(it.dlc), [, m, d] = it.dlc.split('-');
  const q = it.quantite || 1;
  const el = document.createElement('div');
  el.className = 'carte ' + etatJ(j);
  el.innerHTML = `<div class="tete">
      <div class="compte">${compteur(j)}<span>${legende(j)}</span></div>
      <div class="nom"></div>
      <div class="date-imp">${d}.${m}</div>
    </div>
    <div class="actions"><div class="dedans"><div class="pile">
      <div class="etiq">Nom, quantité et date</div>
      <div class="rang">
        <input type="text" maxlength="80">
        <input type="number" min="1" max="99" value="${q}">
      </div>
      <div class="rang"><input type="date" value="${it.dlc}"></div>
      <div class="etiq">Emplacement</div>
      <div class="rang lieux">
        <button class="btn" data-l="frigo"><svg class="i"><use href="#ic-frigo"/></svg>Frigo</button>
        <button class="btn" data-l="congélateur"><svg class="i"><use href="#ic-gel"/></svg>Congélo</button>
        <button class="btn" data-l="placard"><svg class="i"><use href="#ic-placard"/></svg>Placard</button>
      </div>
      <div class="etiq">Ce qui change la date</div>
      <div class="rang">
        <button class="btn jaune" data-a="ouvert"><svg class="i"><use href="#ic-goutte"/></svg>Entamé</button>
        <button class="btn gel" data-a="gele"><svg class="i"><use href="#ic-gel"/></svg>Congelé</button>
      </div>
      <div class="etiq">Sortie du stock</div>
      <div class="rang">
        <button class="btn" data-a="ok"><svg class="i"><use href="#ic-moins"/></svg>Consommé</button>
        <button class="btn danger" data-a="ko"><svg class="i"><use href="#ic-poubelle"/></svg>Tout retirer</button>
      </div>
    </div></div></div>`;

  const nom = el.querySelector('.nom');
  nom.textContent = it.nom;                       // textContent : le nom dicté ne peut pas injecter de HTML
  if(q > 1){ const b = document.createElement('span'); b.className = 'qte'; b.textContent = '\u00d7' + q; nom.appendChild(b); }

  const marques = [];
  if(it.lieu)   marques.push(['lieu', it.lieu]);
  if(it.entame) marques.push(['ouvert', 'entamé']);
  if(it.congele_le) marques.push(['gele', 'congelé le ' + it.congele_le.slice(8,10) + '.' + it.congele_le.slice(5,7)]);
  if(marques.length){
    const meta = document.createElement('div'); meta.className = 'meta';
    marques.forEach(([type, texte], i) => {
      if(i){ const p = document.createElement('span'); p.textContent = '·'; meta.appendChild(p); }
      const s = document.createElement('span');
      if(type !== 'lieu') s.className = type;
      s.textContent = texte;
      meta.appendChild(s);
    });
    nom.appendChild(meta);
  }

  const champNom = el.querySelector('input[type=text]');
  champNom.value = it.nom;
  el.querySelector('.tete').onclick = () => el.classList.toggle('ouvert');
  champNom.onchange = e => {
    const v = e.target.value.trim().slice(0,80);
    v && v !== it.nom ? modifier(it.id, { nom:v, lieu: devineLieu(v) }) : (e.target.value = it.nom);
  };
  el.querySelector('input[type=number]').onchange = e =>
    modifier(it.id, { quantite: Math.min(99, Math.max(1, parseInt(e.target.value, 10) || 1)) });
  el.querySelector('input[type=date]').onchange = e => { if(e.target.value) modifier(it.id, { dlc: e.target.value }); };
  el.querySelectorAll('.lieux .btn').forEach(b => {
    if(b.dataset.l === it.lieu) b.classList.add('choisi');
    b.onclick = () => modifier(it.id, { lieu: it.lieu === b.dataset.l ? '' : b.dataset.l });
  });
  el.querySelector('[data-a="ouvert"]').onclick = () => entamer(it);
  el.querySelector('[data-a="gele"]').onclick   = () => congeler(it);
  el.querySelector('[data-a="ok"]').onclick     = () => consommer(it);
  el.querySelector('[data-a="ko"]').onclick     = () => jeter(it);
  return el;
}

/* ══════ nettoyage du stock ══════ */
$('purger').onclick = () => {
  const vieux = items.filter(i => restant(i.dlc) < 0);
  retirerPlusieurs(vieux, vieux.length + ' produit' + (vieux.length > 1 ? 's dépassés retirés' : ' dépassé retiré'));
};
$('vider').onclick = () => {
  if(!items.length){ $('note').textContent = 'Le stock est déjà vide.'; return; }
  if(confirm('Retirer les ' + items.length + ' produits du stock ?')) retirerPlusieurs([...items], 'Stock vidé');
};

/* ══════ relecture avant ajout ══════ */
$('lireBtn').onclick = () => {
  $('saisie').blur();                       // referme le clavier, sinon il masque le panneau
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  const txt = $('saisie').value;
  if(!txt.trim()){ $('note').textContent = 'Le cadre est vide — écrivez ou dictez dedans avant d’analyser.'; return; }
  enAttente = lire(txt);
  let sansDate = false;
  if(!enAttente.length){
    const d = jour0(); d.setDate(d.getDate() + 7);
    enAttente = txt.split(/[\n,;•]|\s+(?:et|puis)\s+/i).map(t => t.trim()).filter(Boolean)
      .map(t => { const q = extraireQuantite(t); const nom = nettoyer(q.reste);
                  return nom ? { nom, dlc: iso(d), lieu: devineLieu(nom), quantite: q.qte } : null; })
      .filter(Boolean);
    if(!enAttente.length){ $('note').textContent = 'Rien à ajouter — tapez un nom de produit.'; return; }
    sansDate = true;
  }
  ouvrirPanneau(sansDate);
};
function ouvrirPanneau(sansDate){
  $('sousTitre').textContent = sansDate
    ? "Aucune date reconnue : elles sont provisoirement fixées à J+7. Corrigez-les avant d'ajouter."
    : `${enAttente.length} produit${enAttente.length>1?'s reconnus':' reconnu'} — corrigez le nom, la quantité ou la date.`;
  const zone = $('relecture');
  zone.innerHTML = '';
  enAttente.forEach((o, i) => {
    const r = document.createElement('div');
    r.className = 'relu';
    const n = document.createElement('input'); n.type = 'text'; n.maxLength = 80; n.value = o.nom;
    const q = document.createElement('input'); q.type = 'number'; q.min = 1; q.max = 99; q.value = o.quantite;
    const d = document.createElement('input'); d.type = 'date'; d.value = o.dlc;
    const x = document.createElement('button'); x.className = 'btn danger'; x.textContent = '✕';
    n.oninput  = e => o.nom = e.target.value;
    q.onchange = e => o.quantite = Math.min(99, Math.max(1, parseInt(e.target.value,10) || 1));
    d.onchange = e => o.dlc = e.target.value;
    x.onclick  = () => { enAttente.splice(i,1); enAttente.length ? ouvrirPanneau(sansDate) : fermerPanneau(); };
    r.append(n, q, d, x);
    zone.appendChild(r);
  });
  $('voile').classList.add('on');
}
const fermerPanneau = () => $('voile').classList.remove('on');
$('annuler').onclick = fermerPanneau;
$('confirmer').onclick = () => {
  const bons = enAttente
    .filter(o => o.nom.trim() && /^\d{4}-\d{2}-\d{2}$/.test(o.dlc))
    .map(o => ({ nom:o.nom.trim().slice(0,80), dlc:o.dlc, lieu:devineLieu(o.nom), quantite:o.quantite || 1 }));
  fermerPanneau();
  if(!bons.length) return;
  const n = ajouter(bons);
  enAttente = [];
  $('saisie').value = '';
  $('note').textContent = n + (n>1 ? ' produits ajoutés.' : ' produit ajouté.');
};

/* ══════ session ══════ */
function montrerApp(){ $('porte').classList.add('cache'); $('app').classList.remove('cache'); $('barre').classList.remove('cache'); }
function montrerPorte(msg){
  $('porte').classList.remove('cache'); $('app').classList.add('cache'); $('barre').classList.add('cache');
  $('erreur').textContent = msg || '';
}
async function ouvrirSession(){
  const { data, error } = await sb.from('foyer_membres').select('foyer_id').single();
  if(error || !data){ montrerPorte("Ce compte n'est rattaché à aucun foyer."); return; }
  foyer = data.foyer_id;
  montrerApp();
  majFil();
  await vider();
  await recharger();
  if(canal) sb.removeChannel(canal);
  canal = sb.channel('foyer-' + foyer)
    .on('postgres_changes', { event:'*', schema:'public', table:'produits', filter:'foyer_id=eq.' + foyer }, recharger)
    .subscribe(s => { if(s === 'CHANNEL_ERROR') fil('coupe','Temps réel interrompu — rouvrez l\'app'); });
}
async function demarrer(){
  majEntete();
  items = lireJSON(CACHE);
  attente = lireJSON(ATTENTE);
  try{ filtre = localStorage.getItem(FILTRE) || 'tous'; }catch(e){}
  document.querySelectorAll('.puce').forEach(p => p.classList.toggle('actif', p.dataset.lieu === filtre));
  if(!distant){ montrerApp(); majFil(); rendre(); return; }
  const { data:{ session } } = await sb.auth.getSession();
  session ? await ouvrirSession() : montrerPorte();
}

$('entrer').onclick = async () => {
  $('erreur').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('mdp').value });
  if(error){ $('erreur').textContent = 'Identifiants refusés.'; return; }
  $('mdp').value = '';
  await ouvrirSession();
};
$('mdp').addEventListener('keydown', e => { if(e.key === 'Enter') $('entrer').click(); });
$('sortir').onclick = async () => {
  if(attente.length && !confirm(attente.length + ' modification(s) ne sont pas encore envoyées. Se déconnecter quand même ?')) return;
  if(canal) sb.removeChannel(canal);
  try{ localStorage.removeItem(CACHE); localStorage.removeItem(ATTENTE); }catch(e){}
  await sb.auth.signOut();
  items = []; attente = []; foyer = null; canal = null;
  montrerPorte('');
};

window.addEventListener('online',  () => { majFil(); if(foyer) vider().then(recharger); });
window.addEventListener('offline', () => majFil());
document.addEventListener('visibilitychange', () => { if(!document.hidden && foyer){ vider(); recharger(); } });

if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
demarrer();
</script>
